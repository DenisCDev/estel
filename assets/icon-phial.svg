    <radialGradient id="halo" cx="50%" cy="58%" r="58%">
      <stop offset="0%" stop-color="#c8fff6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3ec8bc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3ec8bc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="42%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="45%" stop-color="#d8f4f0"/>
      <stop offset="100%" stop-color="#8eccc6"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="18" r="14" fill="url(#halo)"/>
  <ellipse cx="16" cy="19" rx="10" ry="9.5" fill="url(#glass)" stroke="#1c3a38" stroke-width="1.3"/>
  <rect x="8.5" y="8.2" width="15" height="3.4" rx="1.4" fill="#d5dee4" stroke="#1c3a38" stroke-width="1.1"/>
  <circle cx="16" cy="7.2" r="2.1" fill="#cfd8de" stroke="#1c3a38" stroke-width="1.1"/>
  <circle cx="16" cy="18.5" r="2.4" fill="#fff4c4"/>
</svg>
