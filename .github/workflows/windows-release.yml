name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build installer and checksums
        shell: powershell
        run: |
          $package = Get-Content Cargo.toml -Raw
          $versionMatch = [regex]::Match($package, '(?m)^version = "([^"]+)"')
          if (-not $versionMatch.Success) {
            throw "Não foi possível ler a versão do Cargo.toml"
          }

          $env:ESTEL_VERSION = $versionMatch.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tagVersion -ne $env:ESTEL_VERSION) {
              throw "A tag $env:GITHUB_REF_NAME não corresponde à versão $env:ESTEL_VERSION do Cargo.toml"
            }
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target\release\estel.exe artifacts\estel-portable-x86_64.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\estel.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Get-ChildItem artifacts\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content artifacts\SHA256SUMS.txt
          }

      - name: Test installer
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "EstelInstalled"
          $installer = Resolve-Path artifacts\Estel-Setup-x86_64.exe
          $install = Start-Process $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "O instalador terminou com o código $($install.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $installDir "estel.exe"))) {
            throw "O instalador não criou estel.exe"
          }

          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "O instalador não criou o desinstalador"
          }
          $uninstall = Start-Process $uninstaller.FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "O desinstalador terminou com o código $($uninstall.ExitCode)"
          }
          if (Test-Path (Join-Path $installDir "estel.exe")) {
            throw "O desinstalador não removeu estel.exe"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estel-windows
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: estel-windows
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Estel $GITHUB_REF_NAME" \
            --notes "Instalador do Estel para Windows. Baixe **Estel-Setup-x86_64.exe**, abra o arquivo e siga o assistente. Não precisa instalar Git ou Rust."
